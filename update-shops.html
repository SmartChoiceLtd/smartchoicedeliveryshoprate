function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

document.getElementById('updateBtn').addEventListener('click', async function() {
  var btn = this;
  btn.disabled = true;
  var log = document.getElementById('log');
  var progressWrap = document.getElementById('progressWrap');
  var progressBar = document.getElementById('progressBar');
  var statsDiv = document.getElementById('statsDiv');
  log.hidden = false;
  progressWrap.hidden = false;
  statsDiv.hidden = false;
  log.textContent = 'Loading shops from system...\n\n';

  // Load all existing shops
  var shopsRes = await fetch('/api/shops');
  var existingShops = await shopsRes.json();
  log.textContent += 'Found ' + existingShops.length + ' shops in system.\n\n';

  var updated = 0, skipped = 0, failed = 0;

  for (var i = 0; i < SHOP_DATA.length; i++) {
    var row = SHOP_DATA[i];
    var code = row[0];
    var name = row[1];
    var address = row[2];

    progressBar.style.width = Math.round((i / SHOP_DATA.length) * 100) + '%';

    // Find matching shop by code (first word of shop name)
    var match = existingShops.find(function(s) {
      return s.name && s.name.toUpperCase().startsWith(code.toUpperCase() + ' ');
    });

    if (!match) {
      skipped++;
      log.textContent += '— ' + code + ' not found in system, skipping\n';
      document.getElementById('statSkipped').textContent = skipped;
      log.scrollTop = log.scrollHeight;
      continue;
    }

    // Geocode the address
    try {
      var geoRes = await fetch('/api/geocode?address=' + encodeURIComponent(address));
      var geo = await geoRes.json();

      if (!geo.lat || !geo.lng) {
        failed++;
        log.textContent += '✗ ' + code + ' — could not geocode: ' + address + '\n';
        document.getElementById('statFailed').textContent = failed;
        log.scrollTop = log.scrollHeight;
        await sleep(100);
        continue;
      }

      // Update the shop with real address and coordinates
      var updateRes = await fetch('/api/shops/' + encodeURIComponent(match.id), {
        method: 'PUT',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          address: geo.formatted,
          lat: geo.lat,
          lng: geo.lng
        })
      });

      if (updateRes.ok) {
        updated++;
        log.textContent += '✓ ' + code + ' — ' + geo.formatted + '\n';
        document.getElementById('statUpdated').textContent = updated;
      } else {
        failed++;
        log.textContent += '✗ ' + code + ' — update failed\n';
        document.getElementById('statFailed').textContent = failed;
      }
    } catch(e) {
      failed++;
      log.textContent += '✗ ' + code + ' — ' + e.message + '\n';
      document.getElementById('statFailed').textContent = failed;
    }

    log.scrollTop = log.scrollHeight;
    await sleep(200);
  }

  progressBar.style.width = '100%';
  log.textContent += '\nDone! ' + updated + ' updated, ' + skipped + ' skipped, ' + failed + ' failed.';
  btn.textContent = 'Update Complete';
  btn.disabled = false;
});
