<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0C769E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SCD Dash">
<link rel="manifest" href="/dashboard.webmanifest">
<link rel="icon" type="image/png" href="/dash-icon-192.png">
<link rel="apple-touch-icon" href="/dash-icon-180.png">
<title>SCD Dashboard</title>
<style>
:root{--bg:#FAF7F2;--card:#fff;--ink:#2B2620;--ink-soft:#6B6256;--border:#E6DECF;--accent:#0C769E;--accent-soft:#D6EEF7;--warm:#B8472B;--warm-soft:#F4DCC9;--green:#2C6B2C;--green-soft:#EAF4EA;--amber:#8A5A00;--amber-soft:#FBF0D6;--radius:16px;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;min-height:100%;}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:3px solid var(--warm);padding:12px 24px;display:flex;align-items:center;gap:16px;}
.top h1{font-family:Georgia,serif;font-size:22px;font-weight:600;margin:0;flex:1;}
.clock{font-size:15px;color:var(--ink-soft);text-align:right;line-height:1.25;}
.clock b{display:block;font-size:22px;color:var(--ink);font-family:Georgia,serif;}
.pill{border:1px solid var(--border);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;min-height:40px;}
.pill.off{background:var(--amber-soft);color:var(--amber);border-color:#E6D2A0;cursor:default;}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.wrap{padding:20px 24px 40px;max-width:1500px;margin:0 auto;}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:26px 0 10px;}
.wrap>div:first-child h2{margin-top:0;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.big .grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--border);border-left:7px solid var(--c,var(--accent));border-radius:var(--radius);padding:16px 18px;min-height:118px;text-decoration:none;color:var(--ink);box-shadow:0 1px 2px rgba(43,38,32,.05);}
.big .tile{min-height:150px;}
.tile:active{transform:scale(.98);background:var(--accent-soft);}
.ico{font-size:34px;line-height:1;}
.big .ico{font-size:44px;}
.ttl{font-size:18px;font-weight:700;}
.big .ttl{font-size:21px;}
.sub{font-size:13px;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.badge{position:absolute;top:12px;right:14px;background:var(--warm);color:#fff;border-radius:999px;min-width:28px;height:28px;padding:0 9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;}
.star{position:absolute;top:8px;right:10px;border:0;background:var(--amber-soft);color:var(--amber);border-radius:999px;width:38px;height:38px;font-size:20px;cursor:pointer;display:none;}
body.editing .star{display:block;}
body.editing .tile{outline:2px dashed var(--border);}
.star.on{background:var(--amber);color:#fff;}
.empty{color:var(--ink-soft);padding:30px 0;}
.hintbar{font-size:13px;color:var(--ink-soft);margin:0 0 6px;}
@media (max-width:700px){.top{padding:10px 14px}.wrap{padding:14px}.clock{display:none}}
</style>
</head>
<body>
<div class="top">
  <h1>Smart Choice Delivery</h1>
  <span class="pill off" id="offPill" hidden>Offline - showing saved tiles</span>
  <button class="pill" id="editBtn" type="button">Edit favourites</button>
  <button class="pill" id="awakeBtn" type="button">Keep screen on</button>
  <div class="clock"><b id="clkT"></b><span id="clkD"></span></div>
</div>
<div class="wrap" id="out"><div class="empty">Loading&hellip;</div></div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }

// Sign-in check, same as the Hub
fetch('/api/auth?action=check').then(function(r){return r.json();}).then(function(d){
  if(!d.authenticated) location.href='/login.html?redirect='+encodeURIComponent(location.pathname);
}).catch(function(){ setOffline(true); }); // a dropped connection (hotspot) must not throw you to the sign-in page

function setOffline(on){ document.getElementById('offPill').hidden=!on; }
window.addEventListener('offline',function(){ setOffline(true); });
window.addEventListener('online',function(){ setOffline(false); loadHub(); loadBadge(); });

// Clock
function tick(){
  var n=new Date();
  document.getElementById('clkT').textContent=n.toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'});
  document.getElementById('clkD').textContent=n.toLocaleDateString('en-CA',{weekday:'long',month:'short',day:'numeric'});
}
tick(); setInterval(tick,20000);

// The tiles come from the Hub page itself, so a link added to the Hub shows up here with no change to this page.
var COLORS={'Daily Operations':'#0C769E','Admin':'#B8472B','Guides & Training':'#2C6B2C','Customer & Driver Facing':'#8A5A00'};
var BIG={'Daily Operations':1,'Favourites':1};
var sections=[], favs=[], editing=false;
try{ favs=JSON.parse(store('scd_dash_favs')||'[]'); }catch(e){ favs=[]; }

function parseHub(html){
  var doc=new DOMParser().parseFromString(html,'text/html'), out=[];
  doc.querySelectorAll('.section').forEach(function(sec){
    var h=sec.querySelector('h2'); var title=h?h.textContent.trim():'Links';
    var items=[];
    sec.querySelectorAll('a.link-card').forEach(function(a){
      var t=a.querySelector('.link-title'), s=a.querySelector('.link-sub'), i=a.querySelector('.link-icon');
      items.push({href:a.getAttribute('href'),ext:a.getAttribute('target')==='_blank',title:t?t.textContent.trim():a.getAttribute('href'),sub:s?s.textContent.trim():'',icon:i?i.textContent.trim():'•'});
    });
    if(items.length) out.push({title:title,items:items});
  });
  return out;
}
var requestsNew=0;
function tile(it,color){
  var on=favs.indexOf(it.href)>=0;
  return '<a class="tile" style="--c:'+color+'" href="'+esc(it.href)+'"'+(it.ext?' target="_blank" rel="noopener"':'')+' data-href="'+esc(it.href)+'">'+
    '<span class="ico">'+esc(it.icon)+'</span><span class="ttl">'+esc(it.title)+'</span><span class="sub">'+esc(it.sub)+'</span>'+
    (it.href==='/requests.html'&&requestsNew?'<span class="badge">'+requestsNew+'</span>':'')+
    '<button class="star'+(on?' on':'')+'" type="button" data-star="'+esc(it.href)+'" aria-label="Favourite">'+(on?'★':'☆')+'</button></a>';
}
function render(){
  var out=document.getElementById('out');
  if(!sections.length){ out.innerHTML='<div class="empty">Could not load the links. <a href="/hub.html">Open the Hub</a></div>'; return; }
  var all=[]; sections.forEach(function(s){ s.items.forEach(function(it){ all.push({it:it,color:COLORS[s.title]||'#0C769E'}); }); });
  var html='';
  var favItems=favs.map(function(h){ return all.filter(function(x){return x.it.href===h;})[0]; }).filter(Boolean);
  if(favItems.length||editing){
    html+='<div class="big"><h2>Favourites</h2>'+(editing&&!favItems.length?'<p class="hintbar">Tap the star on any tile below to pin it here.</p>':'')+'<div class="grid">'+favItems.map(function(x){return tile(x.it,x.color);}).join('')+'</div></div>';
  } else {
    html+='';
  }
  sections.forEach(function(s){
    html+='<div class="'+(BIG[s.title]?'big':'')+'"><h2>'+esc(s.title)+'</h2><div class="grid">'+s.items.map(function(it){return tile(it,COLORS[s.title]||'#0C769E');}).join('')+'</div></div>';
  });
  out.innerHTML=html;
}
async function loadHub(){
  try{
    var r=await fetch('/hub.html',{cache:'no-store'}); if(!r.ok) throw new Error('hub');
    sections=parseHub(await r.text());
    if(sections.length){ store('scd_dash_cache',JSON.stringify(sections)); setOffline(false); }
  }catch(e){
    // No signal (a tablet on a phone hotspot): show the last tiles that loaded
    setOffline(true);
    if(!sections.length){ try{ sections=JSON.parse(store('scd_dash_cache')||'[]'); }catch(e2){ sections=[]; } }
  }
  render();
}
document.addEventListener('click',function(e){
  var st=e.target.closest&&e.target.closest('[data-star]');
  if(st){ e.preventDefault(); e.stopPropagation(); var h=st.getAttribute('data-star'), i=favs.indexOf(h); if(i>=0) favs.splice(i,1); else favs.push(h); store('scd_dash_favs',JSON.stringify(favs)); render(); return; }
  var t=e.target.closest&&e.target.closest('a.tile');
  if(t&&editing){ e.preventDefault(); } // while editing, tapping a tile does not open it
});
document.getElementById('editBtn').addEventListener('click',function(){
  editing=!editing; document.body.classList.toggle('editing',editing); this.classList.toggle('on',editing); this.textContent=editing?'Done':'Edit favourites'; render();
});

// New-request count on the Requests tile (checked every 5 minutes while the screen is showing)
async function loadBadge(){
  if(document.hidden) return;
  try{
    var r=await fetch('/api/requests'); if(!r.ok) return; var d=await r.json();
    var n=(d.requests||[]).filter(function(q){return q.status==='new';}).length;
    if(n!==requestsNew){ requestsNew=n; render(); }
  }catch(e){}
}

// Keep the screen on (for a tablet left on a stand)
var wake=null;
async function setAwake(on){
  try{
    if(on){ wake=await navigator.wakeLock.request('screen'); wake.addEventListener('release',function(){ wake=null; }); }
    else if(wake){ await wake.release(); wake=null; }
  }catch(e){}
  var b=document.getElementById('awakeBtn'); b.classList.toggle('on',on); b.textContent=on?'Screen stays on':'Keep screen on';
}
if(!('wakeLock' in navigator)) document.getElementById('awakeBtn').style.display='none';
document.getElementById('awakeBtn').addEventListener('click',function(){ var on=!this.classList.contains('on'); store('scd_dash_awake',on?'1':'0'); setAwake(on); });
if(store('scd_dash_awake')==='1') setAwake(true);
document.addEventListener('visibilitychange',function(){
  if(!document.hidden){ if(store('scd_dash_awake')==='1' && !wake) setAwake(true); loadHub(); loadBadge(); }
});

try{ sections=JSON.parse(store('scd_dash_cache')||'[]'); if(sections.length) render(); }catch(e){ sections=[]; }
loadHub().then(loadBadge); setInterval(loadBadge,300000);
</script>
</body>
</html>
