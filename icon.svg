<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <!-- Teal background -->
  <circle cx="256" cy="256" r="256" fill="#0C769E"/>

  <!-- Terracotta ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#B8472B" stroke-width="18"/>

  <clipPath id="clip"><circle cx="256" cy="256" r="215"/></clipPath>

  <g clip-path="url(#clip)">

    <!-- Bouquet at 50% opacity -->
    <g transform="translate(256,455) scale(1.56) translate(-256,-380)" opacity="0.5">

      <!-- Stems -->
      <line x1="256" y1="380" x2="256" y2="210" stroke="#F4DCC9" stroke-width="7" stroke-linecap="round"/>
      <line x1="256" y1="380" x2="210" y2="230" stroke="#F4DCC9" stroke-width="7" stroke-linecap="round"/>
      <line x1="256" y1="380" x2="302" y2="230" stroke="#F4DCC9" stroke-width="7" stroke-linecap="round"/>
      <line x1="256" y1="380" x2="170" y2="250" stroke="#F4DCC9" stroke-width="6" stroke-linecap="round"/>
      <line x1="256" y1="380" x2="342" y2="250" stroke="#F4DCC9" stroke-width="6" stroke-linecap="round"/>
      <line x1="256" y1="380" x2="230" y2="190" stroke="#F4DCC9" stroke-width="5" stroke-linecap="round"/>
      <line x1="256" y1="380" x2="282" y2="190" stroke="#F4DCC9" stroke-width="5" stroke-linecap="round"/>

      <!-- Leaves -->
      <ellipse cx="228" cy="305" rx="24" ry="11" fill="none" stroke="#F4DCC9" stroke-width="4" transform="rotate(-35 228 305)"/>
      <ellipse cx="284" cy="305" rx="24" ry="11" fill="none" stroke="#F4DCC9" stroke-width="4" transform="rotate(35 284 305)"/>

      <!-- Flowers -->
      <circle cx="256" cy="190" r="30" fill="none" stroke="#F4DCC9" stroke-width="5"/><circle cx="256" cy="190" r="12" fill="#F4DCC9"/>
      <circle cx="185" cy="215" r="25" fill="none" stroke="#F4DCC9" stroke-width="5"/><circle cx="185" cy="215" r="10" fill="#F4DCC9"/>
      <circle cx="327" cy="215" r="25" fill="none" stroke="#F4DCC9" stroke-width="5"/><circle cx="327" cy="215" r="10" fill="#F4DCC9"/>
      <circle cx="210" cy="160" r="20" fill="none" stroke="#F4DCC9" stroke-width="4"/><circle cx="210" cy="160" r="8" fill="#F4DCC9"/>
      <circle cx="302" cy="160" r="20" fill="none" stroke="#F4DCC9" stroke-width="4"/><circle cx="302" cy="160" r="8" fill="#F4DCC9"/>
      <circle cx="158" cy="235" r="18" fill="none" stroke="#F4DCC9" stroke-width="4"/><circle cx="158" cy="235" r="7" fill="#F4DCC9"/>
      <circle cx="354" cy="235" r="18" fill="none" stroke="#F4DCC9" stroke-width="4"/><circle cx="354" cy="235" r="7" fill="#F4DCC9"/>

    </g>

    <!-- Terracotta ribbon at full opacity -->
    <path d="M163 428 Q256 410 349 428" stroke="#B8472B" stroke-width="12" fill="none" stroke-linecap="round"/>

    <!-- SCD letters -->
    <text x="140" y="335" font-family="Arial,Helvetica,sans-serif" font-size="175" font-weight="700" fill="#FFFFFF" text-anchor="middle">S</text>
    <text x="256" y="272" font-family="Arial,Helvetica,sans-serif" font-size="175" font-weight="700" fill="#7EC8E3" text-anchor="middle">C</text>
    <text x="372" y="335" font-family="Arial,Helvetica,sans-serif" font-size="175" font-weight="700" fill="#FFFFFF" text-anchor="middle">D</text>

  </g>
</svg>
