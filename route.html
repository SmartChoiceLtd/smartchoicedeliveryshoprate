<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Choice Delivery — My Route</title>
<style>
:root{--bg:#FAF7F2;--card:#fff;--ink:#2B2620;--ink-soft:#6B6256;--border:#E6DECF;--accent:#0C769E;--accent-soft:#D6EEF7;--warm:#B8472B;--warm-soft:#F4DCC9;--green:#2C6B2C;--green-soft:#EAF4EA;--radius:12px;}
.scan-spinner{width:18px;height:18px;border:3px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg);}}
*{box-sizing:border-box;}html,body{height:100%;margin:0;}
[hidden]{display:none !important;}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
h1{font-family:Georgia,serif;font-weight:600;font-size:18px;margin:0;}
.topbar{background:var(--card);border-bottom:3px solid var(--warm);padding:14px 20px;}
.main{padding:16px;max-width:600px;margin:0 auto;}
.loading,.empty,.notfound{text-align:center;padding:60px 20px;color:var(--ink-soft);}
.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block;text-align:center;}
.btn-ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
.btn:hover{opacity:0.9;}
.stop-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.stop-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:13px;margin-right:8px;}
.stop-name{font-size:15px;font-weight:700;}
.stop-addr{font-size:13px;color:var(--ink-soft);margin:4px 0 10px;}
.stop-actions{display:flex;gap:8px;}
.stop-actions .btn{flex:1;min-height:44px;touch-action:manipulation;}
.refresh-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.refresh-row button{background:transparent;border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--ink-soft);}
</style>
</head>
<body>
<div class="topbar">
  <h1>My Route</h1>
  <label style="font-size:12px;color:var(--ink-soft);display:block;margin-top:10px;">Scanning as:</label>
  <select id="scanDeliveryType" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-top:2px;">
    <option value="store" selected>Store to Door</option>
    <option value="wholesale">Wholesale</option>
    <option value="events">Events</option>
  </select>
  <button class="btn" id="scanTagBtn" style="margin-top:8px;width:100%;">&#128248; Scan Tag &mdash; Add to Route</button>
  <input type="file" id="fTagPhoto" accept="image/*" capture="environment" hidden>
  <div id="scanStatus" hidden style="font-size:13px;color:var(--ink-soft);margin-top:8px;"></div>
  <a class="btn btn-ghost" id="manualEntryLink" style="margin-top:8px;width:100%;">Manual Entry (no tag to scan)</a>
</div>
<div class="main">
  <div class="loading" id="loadingMsg">Loading your route&hellip;</div>
  <div class="notfound" id="notFoundMsg" hidden>Driver link not found. Check your link or contact your dispatcher.</div>
  <div class="empty" id="emptyMsg" hidden>No pending deliveries right now. Scan a tag on the delivery form to add one.</div>
  <div id="content" hidden>
    <div class="refresh-row">
      <span id="countLabel" style="font-size:13px;color:var(--ink-soft);"></span>
      <button id="refreshBtn">Refresh</button>
    </div>
    <div id="stopsList"></div>
  </div>
</div>

<script>
// Reads the EXIF Orientation tag (if present) directly from the JPEG's
// binary data. iOS commonly stores photos with the raw pixel data in one
// orientation and a metadata flag indicating how it should be displayed -
// canvas drawing does not respect that flag by default, so without this,
// a photo taken in one orientation on an iPhone could get compressed
// sideways or upside-down even though it looks correct in the Photos app,
// which is exactly the kind of scrambled input that would confuse the
// vision API into misreading which field is which on a tag.
function getExifOrientation(arrayBuffer) {
  var view = new DataView(arrayBuffer);
  if (view.byteLength < 4 || view.getUint16(0, false) !== 0xFFD8) return 1;
  var offset = 2, length = view.byteLength;
  while (offset + 4 <= length) {
    var marker = view.getUint16(offset, false);
    offset += 2;
    if (marker === 0xFFE1) {
      if (offset + 10 > length || view.getUint32(offset + 2, false) !== 0x45786966) return 1;
      var tiffOffset = offset + 8;
      var little = view.getUint16(tiffOffset, false) === 0x4949;
      var firstIFDOffset = view.getUint32(tiffOffset + 4, little);
      var dirStart = tiffOffset + firstIFDOffset;
      if (dirStart + 2 > length) return 1;
      var entries = view.getUint16(dirStart, little);
      for (var i = 0; i < entries; i++) {
        var entryOffset = dirStart + 2 + i * 12;
        if (entryOffset + 10 > length) break;
        if (view.getUint16(entryOffset, little) === 0x0112) return view.getUint16(entryOffset + 8, little);
      }
      return 1;
    } else if ((marker & 0xFF00) !== 0xFF00) {
      break;
    } else {
      if (offset + 2 > length) break;
      offset += view.getUint16(offset, false);
    }
  }
  return 1;
}

var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

function compressPhotoToBase64(file) {
  // EXIF orientation correction is iOS-only: Android photos were working
  // correctly before this existed, and applying the same correction logic
  // there caused new scrambled-read problems instead of fixing anything -
  // likely a parsing edge case specific to how Android's camera pipeline
  // writes JPEG/EXIF data. Rather than debug that blind, Android keeps
  // running the exact simple path that had zero issues.
  if (!isIOS) {
    return new Promise(function(resolve, reject) {
      var img = new Image();
      var reader = new FileReader();
      reader.onload = function(e) {
        img.onload = function() {
          var maxSide = 1200;
          var w = img.width, h = img.height;
          if (w > maxSide || h > maxSide) {
            if (w > h) { h = Math.round(h * (maxSide / w)); w = maxSide; }
            else { w = Math.round(w * (maxSide / h)); h = maxSide; }
          }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = function() { reject(new Error('Could not read photo.')); };
        img.src = e.target.result;
      };
      reader.onerror = function() { reject(new Error('Could not read photo file.')); };
      reader.readAsDataURL(file);
    });
  }

  return new Promise(function(resolve, reject) {
    var bufReader = new FileReader();
    bufReader.onload = function(bufEvent) {
      var orientation = 1;
      try { orientation = getExifOrientation(bufEvent.target.result); } catch (e) { orientation = 1; }

      var img = new Image();
      var urlReader = new FileReader();
      urlReader.onload = function(e) {
        img.onload = function() {
          var maxSide = 1200;
          var w = img.width, h = img.height;
          if (w > maxSide || h > maxSide) {
            if (w > h) { h = Math.round(h * (maxSide / w)); w = maxSide; }
            else { w = Math.round(w * (maxSide / h)); h = maxSide; }
          }
          var swapDims = orientation >= 5 && orientation <= 8;
          var canvas = document.createElement('canvas');
          canvas.width = swapDims ? h : w;
          canvas.height = swapDims ? w : h;
          var ctx = canvas.getContext('2d');
          switch (orientation) {
            case 2: ctx.transform(-1, 0, 0, 1, w, 0); break;
            case 3: ctx.transform(-1, 0, 0, -1, w, h); break;
            case 4: ctx.transform(1, 0, 0, -1, 0, h); break;
            case 5: ctx.transform(0, 1, 1, 0, 0, 0); break;
            case 6: ctx.transform(0, 1, -1, 0, h, 0); break;
            case 7: ctx.transform(0, -1, -1, 0, h, w); break;
            case 8: ctx.transform(0, -1, 1, 0, 0, w); break;
            default: break;
          }
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = function() { reject(new Error('Could not read photo.')); };
        img.src = e.target.result;
      };
      urlReader.onerror = function() { reject(new Error('Could not read photo file.')); };
      urlReader.readAsDataURL(file);
    };
    bufReader.onerror = function() { reject(new Error('Could not read photo file.')); };
    bufReader.readAsArrayBuffer(file);
  });
}

var lastActiveStops = [];
var lastSkippedStops = [];

async function scanTagForRoute(file) {
  var statusEl = document.getElementById('scanStatus');
  var btn = document.getElementById('scanTagBtn');
  var originalBtnText = btn.innerHTML;
  statusEl.hidden = false;
  statusEl.style.color = 'var(--ink-soft)';
  statusEl.textContent = 'Reading tag\u2026 this can take a few seconds, please wait for it to finish rather than scanning again.';
  btn.disabled = true;
  btn.innerHTML = '<span class="scan-spinner"></span>Reading tag\u2026';
  try {
    var photoBase64 = await compressPhotoToBase64(file);
    statusEl.textContent = 'Looking up shop details\u2026';
    var shopsRes = await fetch('/api/shops');
    var shops = shopsRes.ok ? await shopsRes.json() : [];
    var shopList = shops.map(function(s) { return { code: s.name.split(' ')[0], name: s.name, aliases: s.aliases || [] }; });

    statusEl.textContent = 'Extracting delivery details\u2026';
    var res = await fetch('/api/scan-tag', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ photo_base64: photoBase64, shops: shopList })
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not read tag.');

    if (!data.address) {
      statusEl.style.color = 'var(--warm)';
      statusEl.textContent = 'Could not read an address from that tag. Please try again with a clearer photo.';
      return;
    }

    var stopRes = await fetch('/api/stops', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        driver: driverCode,
        shop_code: data.shop_code || null,
        address: data.address,
        name: data.name || null,
        order_id: data.order_id || null,
        delivery_type: document.getElementById('scanDeliveryType').value,
        local_date: (function() { var n = new Date(); return n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0'); })()
      })
    });
    var stop = await stopRes.json();
    if (!stopRes.ok) throw new Error(stop.error || 'Could not add to route.');

    statusEl.style.color = 'var(--green)';
    statusEl.textContent = 'Added: ' + (data.name || 'delivery') + (data.order_id ? ' (Order #' + data.order_id + ')' : '') + '. Scan the next one, or view your route below.';

    // Show the new stop immediately using the data we already have, rather
    // than re-fetching /api/stops right away - a fetch that quick can race
    // against the write just made and briefly show stale/incomplete
    // results, which is what caused scans to appear to "not show up" for
    // a couple minutes. Not re-optimized until the next full refresh, but
    // reliably visible right away.
    if (!lastActiveStops.some(function(s) { return s.id === stop.id; })) {
      lastActiveStops.push(stop);
    } else {
      lastActiveStops = lastActiveStops.map(function(s) { return s.id === stop.id ? stop : s; });
    }
    document.getElementById('loadingMsg').hidden = true;
    document.getElementById('emptyMsg').hidden = true;
    document.getElementById('content').hidden = false;
    renderStops(lastActiveStops, lastSkippedStops);
  } catch (e) {
    statusEl.style.color = 'var(--warm)';
    statusEl.textContent = 'Could not add tag: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalBtnText;
  }
}

document.getElementById('scanTagBtn').addEventListener('click', function() {
  document.getElementById('fTagPhoto').click();
});
document.getElementById('fTagPhoto').addEventListener('change', function() {
  var file = this.files[0];
  if (file) scanTagForRoute(file);
  this.value = '';
});

var pathParts = location.pathname.split('/').filter(Boolean);
var driverCode = pathParts[1] ? pathParts[1].toUpperCase() : '';
document.getElementById('manualEntryLink').href = '/driver/' + driverCode.toLowerCase();

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  var d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

var MAX_ROUTE_STOPS = 10; // Google's practical waypoint limit for this deep-link format

function navigateUrl(address) {
  return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(address);
}

// Full multi-stop route through the first MAX_ROUTE_STOPS pending stops (in
// optimized order) - Google Maps supports multiple waypoints in one deep
// link (pipe-separated), with the last stop as the final destination and
// no explicit origin so it starts from wherever the driver currently is.
// Capped rather than including everything: once the queue exceeds Maps'
// practical waypoint limit, completing these first stops naturally rolls
// the next ones into this same window on the next refresh - no separate
// stop-picking UI needed.
function fullRouteUrl(stops) {
  var capped = stops.slice(0, MAX_ROUTE_STOPS);
  if (!capped.length) return '#';
  if (capped.length === 1) return navigateUrl(capped[0].address);
  var destination = encodeURIComponent(capped[capped.length - 1].address);
  var waypoints = capped.slice(0, -1).map(function(s) { return encodeURIComponent(s.address); }).join('|');
  return 'https://www.google.com/maps/dir/?api=1&destination=' + destination + '&waypoints=' + waypoints + '&travelmode=driving';
}

function completeUrl(stop) {
  // Hands off to the driver form, pre-filled with what's already known
  // about this stop, so completing it doesn't mean re-typing or
  // re-scanning anything that was already captured.
  var params = new URLSearchParams();
  if (stop.order_id) params.set('order_id', stop.order_id);
  if (stop.name) params.set('name', stop.name);
  if (stop.address) params.set('address', stop.address);
  if (stop.shop_code) params.set('shop_code', stop.shop_code);
  if (stop.delivery_type) params.set('delivery_type', stop.delivery_type);
  params.set('stop_id', stop.id);
  return '/driver/' + driverCode.toLowerCase() + '?' + params.toString();
}

function stopTypeLabel(s) {
  return s.delivery_type === 'wholesale' ? ' <span style="background:var(--accent-soft);color:var(--accent);font-size:11px;padding:2px 6px;border-radius:6px;font-weight:600;">Wholesale</span>'
    : s.delivery_type === 'events' ? ' <span style="background:var(--warm-soft);color:var(--warm);font-size:11px;padding:2px 6px;border-radius:6px;font-weight:600;">Event</span>'
    : '';
}

function renderStops(active, skipped) {
  var total = active.length + skipped.length;
  document.getElementById('countLabel').textContent = total + ' stop' + (total === 1 ? '' : 's') + ' remaining' + (skipped.length ? ' (' + skipped.length + ' skipped for now)' : '');
  var capped = Math.min(active.length, MAX_ROUTE_STOPS);
  var routeLabel = active.length > MAX_ROUTE_STOPS
    ? '&#128506; Navigate Full Route (first ' + capped + ' of ' + active.length + ' stops)'
    : '&#128506; Navigate Full Route (' + capped + ' stop' + (capped === 1 ? '' : 's') + ')';
  var fullRouteBtn = active.length > 1
    ? '<a class="btn" href="' + fullRouteUrl(active) + '" target="_blank" rel="noopener" style="display:block;width:100%;margin-bottom:14px;text-align:center;">' + routeLabel + '</a>'
    + (active.length > MAX_ROUTE_STOPS ? '<div style="font-size:12px;color:var(--ink-soft);margin:-8px 0 14px;">Complete these first, then refresh &mdash; the next stops will roll into your route automatically.</div>' : '')
    : '';

  var activeHtml = active.map(function(s, i) {
    return '<div class="stop-card">'
      + '<div><span class="stop-num">' + (i+1) + '</span><span class="stop-name">' + escapeHtml(s.name || 'Unnamed recipient') + '</span>' + stopTypeLabel(s) + '</div>'
      + '<div class="stop-addr">' + escapeHtml(s.address || '') + (s.order_id ? ' &bull; Order #' + escapeHtml(s.order_id) : '') + '</div>'
      + '<div class="stop-actions">'
      + '<a class="btn btn-ghost" href="' + navigateUrl(s.address) + '" target="_blank" rel="noopener">Navigate</a>'
      + '<a class="btn" href="' + completeUrl(s) + '">Complete</a>'
      + '<button class="btn btn-ghost" onclick="removeStop(\'' + s.id + '\', this)" style="color:var(--warm);border-color:var(--warm);flex:0 0 auto;padding:10px 14px;">&#10005;</button>'
      + '</div>'
      + '<button class="btn btn-ghost" onclick="toggleSkip(\'' + s.id + '\', true)" style="width:100%;margin-top:8px;font-size:12px;padding:6px;">Skip for now</button>'
      + '</div>';
  }).join('');

  var skippedHtml = !skipped.length ? '' : '<h2 style="margin-top:18px;">Skipped For Now</h2>' + skipped.map(function(s) {
    return '<div class="stop-card" style="opacity:0.7;">'
      + '<div><span class="stop-name">' + escapeHtml(s.name || 'Unnamed recipient') + '</span>' + stopTypeLabel(s) + '</div>'
      + '<div class="stop-addr">' + escapeHtml(s.address || '') + (s.order_id ? ' &bull; Order #' + escapeHtml(s.order_id) : '') + '</div>'
      + '<div class="stop-actions">'
      + '<a class="btn btn-ghost" href="' + navigateUrl(s.address) + '" target="_blank" rel="noopener">Navigate</a>'
      + '<a class="btn" href="' + completeUrl(s) + '">Complete</a>'
      + '<button class="btn btn-ghost" onclick="removeStop(\'' + s.id + '\', this)" style="color:var(--warm);border-color:var(--warm);flex:0 0 auto;padding:10px 14px;">&#10005;</button>'
      + '</div>'
      + '<button class="btn" onclick="toggleSkip(\'' + s.id + '\', false)" style="width:100%;margin-top:8px;font-size:12px;padding:6px;">Include Again</button>'
      + '</div>';
  }).join('');

  document.getElementById('stopsList').innerHTML = fullRouteBtn + activeHtml + skippedHtml;
}

function toggleSkip(stopId, skip) {
  fetch('/api/stops/' + encodeURIComponent(stopId), {
    method: 'PUT', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ skipped: skip })
  }).then(function(r) { if (!r.ok) throw new Error('Status ' + r.status); return r.json(); })
    .then(function() { loadRoute(); })
    .catch(function(e) { alert('Could not update: ' + e.message); });
}

// Optimizes stop order via Google's Directions API (waypoint optimization).
// Falls back to the original order if the API call fails for any reason -
// an unoptimized but usable list beats no list at all.
function optimizeOrder(stops, mapsKey, originLatLng) {
  if (stops.length < 2 || !mapsKey) return Promise.resolve(stops);
  var hasRealOrigin = !!originLatLng;
  var origin = hasRealOrigin ? (originLatLng.lat + ',' + originLatLng.lng) : encodeURIComponent(stops[0].address);
  var destinationIdx = stops.length - 1;
  // With a real GPS origin, every stop can be treated as an optimizable
  // waypoint (nothing needs to be "sacrificed" as a fake starting point).
  // Without one, fall back to the old approach: stop 0 anchors the start
  // since we have no better reference for where the route begins.
  var waypointStops = hasRealOrigin ? stops.slice(0, -1) : stops.slice(1, -1);
  var destination = encodeURIComponent(stops[destinationIdx].address);
  var waypoints = waypointStops.map(function(s) { return encodeURIComponent(s.address); });
  var url = 'https://maps.googleapis.com/maps/api/directions/json?origin=' + origin
    + '&destination=' + destination
    + (waypoints.length ? '&waypoints=optimize:true|' + waypoints.join('|') : '')
    + '&key=' + mapsKey;
  return fetch(url).then(function(r) { return r.json(); }).then(function(data) {
    if (data.status !== 'OK' || !data.routes || !data.routes[0]) return stops;
    var order = data.routes[0].waypoint_order;
    if (!order) return stops;
    var reordered = order.map(function(idx) { return waypointStops[idx]; });
    return hasRealOrigin
      ? reordered.concat([stops[destinationIdx]])
      : [stops[0]].concat(reordered, [stops[destinationIdx]]);
  }).catch(function() { return stops; });
}

// Best-effort current location - resolves null (not a rejection) on any
// failure or denial, so the caller can cleanly fall back rather than
// needing its own try/catch for a permissions problem.
function getCurrentLocation() {
  return new Promise(function(resolve) {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      function(pos) { resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }); },
      function() { resolve(null); },
      { timeout: 5000, maximumAge: 60000 }
    );
  });
}

function removeStop(stopId, btn) {
  if (!confirm('Remove this delivery from your route? This doesn\'t submit it - use this for wrong scans or cancelled deliveries.')) return;
  btn.disabled = true;
  fetch('/api/stops/' + encodeURIComponent(stopId), {
    method: 'PUT', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ status: 'abandoned' })
  }).then(function(r) { if (!r.ok) throw new Error('Status ' + r.status); return r.json(); })
    .then(function() { loadRoute(); })
    .catch(function(e) { alert('Could not remove: ' + e.message); btn.disabled = false; });
}

function loadRoute() {
  document.getElementById('loadingMsg').hidden = false;
  document.getElementById('content').hidden = true;
  document.getElementById('emptyMsg').hidden = true;

  Promise.all([
    fetch('/api/stops').then(function(r) { return r.json(); }),
    fetch('/api/config').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; })
  ]).then(function(results) {
    var allStops = results[0];
    var mapsKey = results[1] && results[1].key;
    var mine = allStops.filter(function(s) { return s.status === 'pending' && (s.driver || '').toUpperCase() === driverCode; });

    if (!mine.length) {
      document.getElementById('loadingMsg').hidden = true;
      document.getElementById('emptyMsg').hidden = false;
      return;
    }

    var active = mine.filter(function(s) { return !s.skipped; });
    var skipped = mine.filter(function(s) { return s.skipped; });

    // Show stops immediately in their existing order - never make the
    // driver wait on GPS just to see and act on their route. A slow or
    // stuck location permission prompt (a real inconsistency on some iOS
    // Safari versions) must never block this from appearing at all.
    lastActiveStops = active;
    lastSkippedStops = skipped;
    renderStops(active, skipped);
    document.getElementById('loadingMsg').hidden = true;
    document.getElementById('content').hidden = false;

    // Attempt geolocation + re-optimization separately, in the background.
    // If it succeeds, silently re-render with a better order. If it's
    // slow, stuck, or denied, the driver already has a fully usable route
    // and never notices anything was waiting on it.
    getCurrentLocation().then(function(currentLocation) {
      return optimizeOrder(active, mapsKey, currentLocation);
    }).then(function(ordered) {
      lastActiveStops = ordered;
      renderStops(ordered, skipped);
    }).catch(function() { /* best-effort - already showing a usable route */ });
  }).catch(function(e) {
    document.getElementById('loadingMsg').textContent = 'Could not load your route: ' + e.message;
  });
}

if (!driverCode) {
  document.getElementById('loadingMsg').hidden = true;
  document.getElementById('notFoundMsg').hidden = false;
} else {
  document.getElementById('refreshBtn').addEventListener('click', loadRoute);
  loadRoute();
}
</script>
</body>
</html>
