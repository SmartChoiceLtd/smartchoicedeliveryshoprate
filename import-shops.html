var CALGARY_LAT = 51.0447;
var CALGARY_LNG = -114.0719;

function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

document.getElementById('importBtn').addEventListener('click', async function() {
  var btn = this;
  btn.disabled = true;
  var log = document.getElementById('log');
  var progressWrap = document.getElementById('progressWrap');
  var progressBar = document.getElementById('progressBar');
  log.hidden = false;
  progressWrap.hidden = false;
  log.textContent = 'Starting import of ' + SHOPS.length + ' shops...\n\n';

  var success = 0, failed = 0, skipped = 0;

  for (var i = 0; i < SHOPS.length; i++) {
    var shop = SHOPS[i];
    progressBar.style.width = Math.round((i / SHOPS.length) * 100) + '%';

    try {
      var payload = {
        name: shop.name,
        address: 'Calgary, AB, Canada',
        lat: CALGARY_LAT,
        lng: CALGARY_LNG,
        zonePrices: {C1:10,C2:12,C3:13,C4:14,C5:15,OUT1:25,OUT2:35,OUT3:55,OUT4:75},
        communityZones: {},
        townPrices: {}
      };

      var res = await fetch('/api/shops', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        success++;
        log.textContent += '✓ ' + shop.code + ' — ' + shop.name + '\n';
      } else {
        var err = await res.json().catch(function(){return{};});
        failed++;
        log.textContent += '✗ ' + shop.code + ' — ' + (err.error || 'Error ' + res.status) + '\n';
      }
    } catch(e) {
      failed++;
      log.textContent += '✗ ' + shop.code + ' — ' + e.message + '\n';
    }

    log.scrollTop = log.scrollHeight;
    await sleep(100);
  }

  progressBar.style.width = '100%';
  log.textContent += '\nDone! ' + success + ' imported, ' + failed + ' failed, ' + skipped + ' skipped.';
  btn.textContent = 'Import Complete';
});
