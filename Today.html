<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today's Deliveries — Smart Choice Delivery</title>
<style>
:root{--bg:#FAF7F2;--card:#fff;--ink:#2B2620;--ink-soft:#6B6256;--border:#E6DECF;--accent:#0C769E;--accent-soft:#D6EEF7;--warm:#B8472B;--warm-soft:#F4DCC9;--green:#2C6B2C;--green-soft:#EAF4EA;--radius:12px;}
*{box-sizing:border-box;}html,body{height:100%;margin:0;}
[hidden]{display:none !important;}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
h1{font-family:Georgia,serif;font-weight:600;font-size:19px;margin:0;}
.topbar{background:var(--card);border-bottom:3px solid var(--warm);padding:14px 20px;display:flex;align-items:center;gap:12px;}
.topbar a{font-size:13px;color:var(--accent);text-decoration:none;margin-left:auto;}
.main{max-width:520px;margin:0 auto;padding:20px 16px;}
.big-count{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:32px;text-align:center;margin-bottom:16px;}
.big-number{font-size:64px;font-weight:700;color:var(--accent);font-family:Georgia,serif;line-height:1;}
.big-label{font-size:14px;color:var(--ink-soft);margin-top:8px;text-transform:uppercase;letter-spacing:0.05em;}
.date-label{font-size:13px;color:var(--ink-soft);text-align:center;margin-bottom:20px;}
.driver-breakdown{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.driver-breakdown h2{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;margin:0 0 12px;}
.driver-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.driver-row:last-child{border-bottom:none;}
.driver-name{font-weight:600;font-size:14px;}
.driver-count{font-size:16px;font-weight:700;color:var(--accent);font-family:Georgia,serif;}
.empty{text-align:center;color:var(--ink-soft);padding:20px;font-size:13px;}
.btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-top:16px;}
.loading{text-align:center;padding:60px 20px;color:var(--ink-soft);}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="topbar">
  <h1>Today's Deliveries</h1>
  <a href="/hub.html">Hub</a>
</div>
<div class="main">
  <div id="loadingDiv" class="loading">
    <div class="spinner"></div>
    <p>Loading...</p>
  </div>
  <div id="contentDiv" hidden>
    <div class="date-label" id="dateLabel"></div>
    <div class="big-count">
      <div class="big-number" id="totalCount">0</div>
      <div class="big-label">Deliveries Completed Today</div>
    </div>
    <div class="driver-breakdown">
      <h2>By Driver</h2>
      <div id="driverList"></div>
    </div>
    <button class="btn" id="refreshBtn">Refresh</button>
  </div>
</div>

<script>
function getToday() {
  var now = new Date();
  return now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
}

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

async function loadCounts() {
  document.getElementById('loadingDiv').hidden = false;
  document.getElementById('contentDiv').hidden = true;
  try {
    var res = await fetch('/api/orders');
    var allOrders = await res.json();
    var today = getToday();

    var todayOrders = allOrders.filter(function(o) {
      return (o.date || o.received_at || '').slice(0, 10) === today;
    });

    document.getElementById('totalCount').textContent = todayOrders.length;
    var dateObj = new Date(today + 'T12:00:00');
    document.getElementById('dateLabel').textContent = dateObj.toLocaleDateString('en-CA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    var byDriver = {};
    todayOrders.forEach(function(o) {
      var code = (o.driver || 'Unassigned').toUpperCase();
      byDriver[code] = (byDriver[code] || 0) + 1;
    });

    var driverCodes = Object.keys(byDriver).sort(function(a, b) { return byDriver[b] - byDriver[a]; });
    var listEl = document.getElementById('driverList');
    if (!driverCodes.length) {
      listEl.innerHTML = '<div class="empty">No deliveries recorded yet today.</div>';
    } else {
      listEl.innerHTML = driverCodes.map(function(code) {
        return '<div class="driver-row"><span class="driver-name">' + esc(code) + '</span><span class="driver-count">' + byDriver[code] + '</span></div>';
      }).join('');
    }

    document.getElementById('loadingDiv').hidden = true;
    document.getElementById('contentDiv').hidden = false;
  } catch (e) {
    document.getElementById('loadingDiv').innerHTML = '<p style="color:var(--warm)">Could not load: ' + esc(e.message) + '</p>';
  }
}

fetch('/api/auth?action=check')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (!data.authenticated) {
      window.location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname);
      return;
    }
    loadCounts();
  })
  .catch(function() {
    window.location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname);
  });

document.getElementById('refreshBtn').addEventListener('click', loadCounts);
</script>
</body>
</html>
